<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6bcb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تقرير الفني">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>التقرير اليومي للفني</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d5dae2;--pri:#0b6bcb;--onpri:#fff;--ok:#1a7f4b;--okbg:#e6f4ec;--bad:#b3410a;--badbg:#fdeee4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161b;--card:#1c2027;--tx:#eceff3;--mut:#9aa3b0;--bd:#313743;--pri:#5aa2f0;--onpri:#0b1320;--ok:#4cc38a;--okbg:#17302a;--bad:#f59e6b;--badbg:#3a2418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161b;--card:#1c2027;--tx:#eceff3;--mut:#9aa3b0;--bd:#313743;--pri:#5aa2f0;--onpri:#0b1320;--ok:#4cc38a;--okbg:#17302a;--bad:#f59e6b;--badbg:#3a2418;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:21px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.badge{font-size:13px;border-radius:99px;padding:1px 10px}
.okb{background:var(--okbg);color:var(--ok)}.badb{background:var(--badbg);color:var(--bad)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--bd);border-radius:12px;padding:4px 12px 12px;margin-bottom:10px;background:var(--card)}
.card.ok{border-inline-start:5px solid var(--ok)}.card.bad{border-inline-start:5px solid var(--bad)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:600}
button{font:inherit;font-size:16px;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 16px;cursor:pointer}
.add{width:100%;border-style:dashed;color:var(--pri);font-weight:600}
.del{min-height:36px;padding:0 12px;font-size:14px;color:var(--bad)}
.act{display:grid;gap:10px;margin-top:6px}
.wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700;min-height:54px}
.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri);font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font:inherit;font-size:14px;max-height:50vh;overflow:auto;margin:10px 0 0}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<main>
<h1>التقرير اليومي للفني</h1>
<p class="sub">عبّئ التقرير في نهاية الدوام ثم أرسله إلى مدير الإدارة الفنية.</p>

<section>
<h2>بيانات الفني</h2>
<label for="name">اسم الفني</label>
<input id="name" autocomplete="name">
<div class="row">
<div><label for="date">التاريخ</label><input id="date" type="date"></div>
<div><label for="area">المنطقة / الموقع</label><input id="area"></div>
</div>
<div class="row">
<div><label for="tin">وقت الحضور</label><input id="tin" type="time"></div>
<div><label for="tout">وقت الانصراف</label><input id="tout" type="time"></div>
</div>
</section>

<section>
<h2>الأعمال المنجزة <span class="badge okb" id="cok">0</span></h2>
<div id="done"></div>
<button class="add" type="button" id="addDone">+ إضافة عمل منجز</button>
</section>

<section>
<h2>الأعمال المتعثرة <span class="badge badb" id="cbad">0</span></h2>
<div id="stuck"></div>
<button class="add" type="button" id="addStuck">+ إضافة عمل متعثر</button>
</section>

<section>
<h2>ملاحظات</h2>
<textarea id="notes" placeholder="أي ملاحظات إضافية، احتياجات من مواد أو دعم"></textarea>
</section>

<section>
<h2>الإرسال</h2>
<label for="mgr">رقم واتساب المدير (مع رمز الدولة، مرة واحدة فقط)</label>
<input id="mgr" type="tel" inputmode="tel" dir="ltr" placeholder="2189XXXXXXXX">
<div class="act">
<button class="wa" type="button" id="send">إرسال إلى المدير عبر واتساب</button>
<label for="repo">مستودع GitHub لاستلام التقارير (مرة واحدة فقط)</label>
<input id="repo" dir="ltr" placeholder="username/repo-name" autocapitalize="none">
<button class="pri" type="button" id="gh">إرسال عبر GitHub</button>
<button type="button" id="share" hidden>مشاركة بتطبيق آخر</button>
<button type="button" id="copy">نسخ التقرير</button>
<button type="button" id="prev">معاينة التقرير</button>
<button type="button" id="reset" class="del">مسح النموذج وبدء يوم جديد</button>
</div>
<pre id="pv" hidden></pre>
<p class="hint">يتم حفظ ما تكتبه تلقائياً على هاتفك حتى لا تفقده.</p>
</section>
<section id="inst" hidden>
<h2>تثبيت التطبيق</h2>
<button class="pri" type="button" id="instBtn">تثبيت على الهاتف</button>
<p class="hint" id="instHint"></p>
</section>
</main>
<div id="toast"></div>

<script>
(function(){
var KEY="tech-daily-report-v1";
var $=function(i){return document.getElementById(i)};
var REASONS=["نقص في المواد أو المعدات","العميل غير متواجد","لم يُسمح بالدخول","عطل يحتاج دعماً فنياً","مشكلة في الموقع (كهرباء / شبكة / وصول)","ضيق الوقت","سبب آخر"];
var PRI=["عالية","متوسطة","منخفضة"];

function el(tag,attrs,html){var e=document.createElement(tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(html)e.innerHTML=html;return e}
function field(cls,label,type,ph){
 return '<label>'+label+'</label>'+(type==="ta"?'<textarea data-f="'+cls+'" placeholder="'+(ph||"")+'"></textarea>':'<input data-f="'+cls+'" placeholder="'+(ph||"")+'">');
}
function opts(list){return list.map(function(o){return '<option>'+o+'</option>'}).join("")}

function addCard(kind,data){
 var box=$(kind==="done"?"done":"stuck");
 var n=box.children.length+1;
 var c=el("div",{"class":"card "+(kind==="done"?"ok":"bad"),"data-kind":kind});
 var h='<div class="ch"><span class="no">عمل '+n+'</span><button type="button" class="del">حذف</button></div>'+
  field("order","رقم الطلب","t")+field("client","العميل / العنوان","t")+field("work",kind==="done"?"العمل المنفذ":"العمل المطلوب","ta");
 if(kind==="done"){
  h+='<div class="row"><div><label>وقت البدء</label><input type="time" data-f="from"></div><div><label>وقت الانتهاء</label><input type="time" data-f="to"></div></div>'+field("mat","المواد المستخدمة","t");
 }else{
  h+='<label>سبب التعثر</label><select data-f="reason">'+opts(REASONS)+'</select>'+field("need","المطلوب لإكمال العمل","ta")+'<label>الأولوية</label><select data-f="pri">'+opts(PRI)+'</select>';
 }
 c.innerHTML=h;
 if(data){Array.prototype.forEach.call(c.querySelectorAll("[data-f]"),function(i){if(data[i.dataset.f]!=null)i.value=data[i.dataset.f]})}
 box.appendChild(c);count();
 return c;
}
function count(){
 ["done","stuck"].forEach(function(k){
  var box=$(k);Array.prototype.forEach.call(box.children,function(c,i){c.querySelector(".no").textContent="عمل "+(i+1)});
 });
 $("cok").textContent=$("done").children.length;$("cbad").textContent=$("stuck").children.length;
}
function cards(kind){
 return Array.prototype.map.call($(kind).children,function(c){
  var o={};Array.prototype.forEach.call(c.querySelectorAll("[data-f]"),function(i){o[i.dataset.f]=i.value.trim()});return o;
 });
}
function state(){return{name:$("name").value,date:$("date").value,area:$("area").value,tin:$("tin").value,tout:$("tout").value,notes:$("notes").value,mgr:$("mgr").value,repo:$("repo").value,done:cards("done"),stuck:cards("stuck")}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state()))}catch(e){}}
function load(){
 var s=null;try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
 if(s){["name","date","area","tin","tout","notes","mgr","repo"].forEach(function(k){if(s[k])$(k).value=s[k]});
  (s.done||[]).forEach(function(d){addCard("done",d)});(s.stuck||[]).forEach(function(d){addCard("stuck",d)});}
 if(!$("date").value){var d=new Date();$("date").value=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
 if(!$("done").children.length)addCard("done");
 count();
}
function line(l,v){return v?l+": "+v+"\n":""}
function build(){
 var s=state(),t="📋 التقرير اليومي للفني\n";
 t+=line("الفني",s.name)+line("التاريخ",s.date)+line("المنطقة",s.area);
 if(s.tin||s.tout)t+="الدوام: "+(s.tin||"--")+" – "+(s.tout||"--")+"\n";
 var d=s.done.filter(function(x){return x.order||x.client||x.work});
 var b=s.stuck.filter(function(x){return x.order||x.client||x.work||x.need});
 t+="\n✅ الأعمال المنجزة ("+d.length+")\n";
 if(!d.length)t+="لا يوجد\n";
 d.forEach(function(x,i){t+=(i+1)+") "+[x.order&&"طلب "+x.order,x.client].filter(Boolean).join(" – ")+"\n"+line("   العمل",x.work)+((x.from||x.to)?"   الوقت: "+(x.from||"--")+" – "+(x.to||"--")+"\n":"")+line("   المواد",x.mat)});
 t+="\n⚠️ الأعمال المتعثرة ("+b.length+")\n";
 if(!b.length)t+="لا يوجد\n";
 b.forEach(function(x,i){t+=(i+1)+") "+[x.order&&"طلب "+x.order,x.client].filter(Boolean).join(" – ")+"\n"+line("   العمل",x.work)+line("   السبب",x.reason)+line("   المطلوب",x.need)+line("   الأولوية",x.pri)});
 if(s.notes)t+="\n📝 ملاحظات: "+s.notes+"\n";
 return t.trim();
}
var tt;function toast(m){var e=$("toast");e.textContent=m;e.className="on";clearTimeout(tt);tt=setTimeout(function(){e.className=""},2400)}
function ok(){if(!$("name").value.trim()){toast("الرجاء كتابة اسم الفني أولاً");$("name").focus();return false}return true}

document.addEventListener("input",save);document.addEventListener("change",save);
$("addDone").onclick=function(){addCard("done").querySelector("input").focus();save()};
$("addStuck").onclick=function(){addCard("stuck").querySelector("input").focus();save()};
document.addEventListener("click",function(e){
 if(e.target.classList.contains("del")&&e.target.closest(".card")){e.target.closest(".card").remove();count();save()}
});
$("send").onclick=function(){
 if(!ok())return;
 var num=$("mgr").value.replace(/\D/g,"");
 var url="https://wa.me/"+num+"?text="+encodeURIComponent(build());
 try{var ta=el("textarea");ta.value=build();document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}catch(e){}
 var w=null;try{w=window.open(url,"_blank")}catch(e){}
 if(!w){try{window.top.location.href=url}catch(e){try{location.href=url}catch(e2){}}}
 toast("إن لم يفتح واتساب، الصق التقرير المنسوخ في المحادثة");
};
if(navigator.share){$("share").hidden=false;$("share").onclick=function(){if(!ok())return;navigator.share({title:"التقرير اليومي",text:build()}).catch(function(){})}}
$("copy").onclick=function(){
 if(!ok())return;var t=build();
 function fb(){var ta=el("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("تم نسخ التقرير")}catch(e){toast("تعذر النسخ")}ta.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("تم نسخ التقرير")},fb)}else fb();
};
$("gh").onclick=function(){
 if(!ok())return;
 var r=$("repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/+$/,"");
 if(!/^[\w.-]+\/[\w.-]+$/.test(r)){toast("اكتب اسم المستودع بالشكل username/repo");$("repo").focus();return}
 var s=state();
 var url="https://github.com/"+r+"/issues/new?title="+encodeURIComponent("تقرير "+s.name+" – "+s.date)+"&body="+encodeURIComponent(build());
 var w=null;try{w=window.open(url,"_blank")}catch(e){}
 if(!w){try{window.top.location.href=url}catch(e){try{location.href=url}catch(e2){}}}
 toast("في صفحة GitHub اضغط Submit new issue لإتمام الإرسال");
};
$("prev").onclick=function(){var p=$("pv");p.textContent=build();p.hidden=!p.hidden};
$("reset").onclick=function(){
 if(!confirm("سيتم مسح كل ما كتبته. هل تريد المتابعة؟"))return;
 var m=$("mgr").value,n=$("name").value,a=$("area").value;
 try{localStorage.removeItem(KEY)}catch(e){}
 $("done").innerHTML="";$("stuck").innerHTML="";["date","tin","tout","notes"].forEach(function(k){$(k).value=""});
 $("name").value=n;$("area").value=a;$("mgr").value=m;
 var d=new Date();$("date").value=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
 addCard("done");count();save();$("pv").hidden=true;window.scrollTo(0,0);
};
var dp=null,inst=$("inst");
var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(!standalone){
 if(ios){inst.hidden=false;$("instBtn").hidden=true;$("instHint").textContent="للتثبيت على الآيفون: اضغط زر المشاركة في Safari ثم اختر «إضافة إلى الشاشة الرئيسية».";}
 window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;inst.hidden=false;$("instHint").textContent="سيظهر التطبيق كأيقونة على شاشة هاتفك ويعمل بدون متصفح.";});
 $("instBtn").onclick=function(){if(dp){dp.prompt();dp=null;inst.hidden=true}};
}
window.addEventListener("appinstalled",function(){inst.hidden=true;toast("تم تثبيت التطبيق")});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
load();
})();
</script>
</body>
</html>
